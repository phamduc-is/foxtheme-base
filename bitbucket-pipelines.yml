image: node:20

pipelines:
  branches:
    main:
      - step:
          name: Lint checks
          script:
            - node scripts/check-js-contract.js --diff
            - node scripts/check-selector-interp.js
            - node scripts/check-capability-headers.mjs
            - node scripts/check-settings-schema.js
            - node scripts/check-toolkit-refs.mjs
            - node scripts/check-listings.mjs
            - node scripts/check-render-filters.js
            - node scripts/check-image-preload.js
            - node scripts/check-doc-newline.js
            # Motion: the prestage CSS and the manifest are GENERATED, and the
            # runtime start state is now the stylesheet's alone — a registry edit
            # without `yarn motion:build` ships a stylesheet that disagrees with
            # the code, which is a jump on the first frame with nothing to catch
            # it. These three need no dependencies (node built-ins only), so they
            # run here without an install step.
            # `check-motion-manifest` is deliberately NOT here: its subject,
            # .motion-manifest.json, is gitignored and regenerated by postinstall,
            # so on a fresh CI checkout it can only ever fail.
            - node scripts/build-motion-prestage.mjs --check
            - node scripts/check-motion-presets.js
            - node scripts/check-motion-easing.js
      - step:
          name: Inline asset budget
          # Not the pipeline's node:20: `yarn install` refuses to link
          # @shopify/cli (engines: node >=22.12) on it and the whole step dies
          # before the check runs. The lint step stays on node:20 because it
          # never installs anything.
          image: node:22
          caches:
            - node
          script:
            # inline_asset_content refuses a file of 15,360 bytes or more and emits
            # an HTML comment in its place — the page silently loses that CSS, with
            # no error anywhere. The inlined stylesheets are BUILT from src/scss, so
            # this step needs dart-sass: install once (scripts skipped — postinstall
            # only regenerates gitignored maps CI does not need).
            - yarn install --frozen-lockfile --ignore-scripts
            - node scripts/check-inline-assets.js
      - step:
          name: Auto release
          # Full history: git-cliff regenerates the whole CHANGELOG from it.
          clone:
            depth: full
          script:
            - chmod +x scripts/ci-release.sh
            - ./scripts/ci-release.sh
    "feat/**":
      - step:
          name: Feature branch must be additive-only
          script:
            - chmod +x scripts/check-additive-feature.sh
            - ./scripts/check-additive-feature.sh
      - step:
          name: Lint checks
          script:
            - node scripts/check-js-contract.js --diff
            - node scripts/check-selector-interp.js
            - node scripts/check-capability-headers.mjs
            - node scripts/check-settings-schema.js
            - node scripts/check-toolkit-refs.mjs
            - node scripts/check-listings.mjs
            - node scripts/check-render-filters.js
            - node scripts/check-image-preload.js
            - node scripts/check-doc-newline.js
            # Motion: the prestage CSS and the manifest are GENERATED, and the
            # runtime start state is now the stylesheet's alone — a registry edit
            # without `yarn motion:build` ships a stylesheet that disagrees with
            # the code, which is a jump on the first frame with nothing to catch
            # it. These three need no dependencies (node built-ins only), so they
            # run here without an install step.
            # `check-motion-manifest` is deliberately NOT here: its subject,
            # .motion-manifest.json, is gitignored and regenerated by postinstall,
            # so on a fresh CI checkout it can only ever fail.
            - node scripts/build-motion-prestage.mjs --check
            - node scripts/check-motion-presets.js
            - node scripts/check-motion-easing.js
      - step:
          name: Inline asset budget
          # Not the pipeline's node:20: `yarn install` refuses to link
          # @shopify/cli (engines: node >=22.12) on it and the whole step dies
          # before the check runs. The lint step stays on node:20 because it
          # never installs anything.
          image: node:22
          caches:
            - node
          script:
            # inline_asset_content refuses a file of 15,360 bytes or more and emits
            # an HTML comment in its place — the page silently loses that CSS, with
            # no error anywhere. The inlined stylesheets are BUILT from src/scss, so
            # this step needs dart-sass: install once (scripts skipped — postinstall
            # only regenerates gitignored maps CI does not need).
            - yarn install --frozen-lockfile --ignore-scripts
            - node scripts/check-inline-assets.js
