<title>Theme Catalog</title>
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f0f2f5; --border: #e3e6eb;
  --text: #1b1f24; --muted: #5d6673; --faint: #8b94a1; --accent: #4f46e5; --accent-soft: #eef0ff;
  --k-section: #2563eb; --k-block: #059669; --k-private: #7c3aed; --k-snippet: #d97706; --k-js: #ca8a04; --k-scss: #db2777;
  --d-added: #15803d; --d-changed: #b45309; --d-renamed: #0e7490; --d-removed: #b91c1c;
  --p-locked: #b91c1c; --p-core: #475569;
  --shadow: 0 1px 2px rgb(16 24 40 / 6%), 0 1px 3px rgb(16 24 40 / 8%);
  --radius: 12px; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --surface: #171a21; --surface-2: #1f232c; --border: #2a2f3a;
    --text: #e7eaf0; --muted: #a0a8b6; --faint: #6f7886; --accent: #8b87ff; --accent-soft: #23234a;
    --k-section: #60a5fa; --k-block: #34d399; --k-private: #a78bfa; --k-snippet: #fbbf24; --k-js: #facc15; --k-scss: #f472b6;
    --d-added: #4ade80; --d-changed: #fbbf24; --d-renamed: #22d3ee; --d-removed: #f87171;
    --p-locked: #f87171; --p-core: #94a3b8;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --surface: #171a21; --surface-2: #1f232c; --border: #2a2f3a;
  --text: #e7eaf0; --muted: #a0a8b6; --faint: #6f7886; --accent: #8b87ff; --accent-soft: #23234a;
  --k-section: #60a5fa; --k-block: #34d399; --k-private: #a78bfa; --k-snippet: #fbbf24; --k-js: #facc15; --k-scss: #f472b6;
  --d-added: #4ade80; --d-changed: #fbbf24; --d-renamed: #22d3ee; --d-removed: #f87171;
  --p-locked: #f87171; --p-core: #94a3b8;
  --shadow: none;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 140px; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }

.topbar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.topbar__inner { max-width: 1440px; margin: 0 auto; padding: 14px 24px; display: grid; gap: 12px; }
.topbar__row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
.brand span { color: var(--faint); font-size: 12px; }
.search { position: relative; flex: 1 1 380px; min-width: 0; max-width: 560px; }
.search input { width: 100%; height: 40px; padding: 0 44px 0 38px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; outline: none; transition: border-color .15s, box-shadow .15s; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search svg { position: absolute; left: 12px; top: 12px; color: var(--faint); }
.search kbd { position: absolute; right: 10px; top: 9px; font: 11px var(--mono); color: var(--faint); border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px; background: var(--surface-2); }
.icon-btn { height: 40px; width: 40px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; color: var(--muted); transition: all .15s; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.chip b { font-weight: 600; color: var(--text); }
.chip[aria-pressed="true"] { border-color: var(--c, var(--accent)); color: var(--text); background: color-mix(in srgb, var(--c, var(--accent)) 12%, var(--surface)); }
.result-count { margin-left: auto; color: var(--faint); font-size: 13px; }

.layout { max-width: 1440px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 28px; }
.sidebar { position: sticky; top: 132px; align-self: start; max-height: calc(100vh - 150px); overflow: auto; padding-right: 4px; }
.sidebar h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 0 0 8px 10px; }
.nav a { display: flex; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 8px; text-decoration: none; color: var(--muted); font-size: 13.5px; }
.nav a:hover { background: var(--surface-2); color: var(--text); }
.nav a.is-active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav a span { color: var(--faint); font-variant-numeric: tabular-nums; }
.nav a.is-empty { opacity: .35; }

.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 28px; }
.steps[hidden] { display: none; }
.step { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); }
.step b { display: block; font-size: 11px; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 2px; }
.step p { margin: 0; font-size: 13px; color: var(--muted); }

.cat { margin-bottom: 36px; }
.cat__head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
.cat__head h2 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
.cat__head span { color: var(--faint); font-size: 13px; }
.cat__need { color: var(--muted); margin: 0 0 14px; font-size: 13.5px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }

main { min-width: 0; }
.card { --c: var(--accent); min-width: 0; position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; transition: border-color .15s, transform .15s; }
.card::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0; background: var(--c); }
.card:hover { border-color: color-mix(in srgb, var(--c) 45%, var(--border)); }
.card__top { display: flex; align-items: center; gap: 8px; }
.badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); white-space: nowrap; }
.card__name { font-family: var(--mono); font-size: 13.5px; font-weight: 600; overflow-wrap: anywhere; }
.copy { margin-left: auto; border: 0; background: transparent; color: var(--faint); padding: 4px; border-radius: 6px; display: grid; place-items: center; }
.copy:hover { background: var(--surface-2); color: var(--text); }
.card__desc { margin: 0; color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.card.is-open .card__desc { -webkit-line-clamp: unset; }
.card__desc.is-empty { color: var(--faint); font-style: italic; cursor: default; }
.card__when { display: none; margin: 0; font-size: 12.5px; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.card.is-open .card__when { display: block; }
.card__note { font-size: 12px; color: var(--faint); }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font: 11.5px var(--mono); padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
.tag--more { background: transparent; border-style: dashed; cursor: pointer; }
.card__file { margin-top: auto; padding-top: 6px; border-top: 1px dashed var(--border); font: 11.5px var(--mono); color: var(--faint); text-decoration: none; display: flex; align-items: center; gap: 6px; overflow: hidden; }
.card__file:hover { color: var(--accent); }
.card__file span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
mark { background: color-mix(in srgb, var(--k-snippet) 30%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }

.chip--change { --c: var(--d-changed); }
.chip--change[hidden] { display: none; }
.dbadge { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; color: var(--d); border: 1px solid color-mix(in srgb, var(--d) 45%, transparent); white-space: nowrap; }
.card[data-change] { border-color: color-mix(in srgb, var(--d) 40%, var(--border)); }
.card__change { font-size: 12px; color: var(--d); }

.changes { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 20px; }
.changes > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.changes > summary::-webkit-details-marker { display: none; }
.changes > summary::after { content: "▾"; margin-left: auto; color: var(--faint); transition: transform .15s; }
.changes[open] > summary::after { transform: rotate(180deg); }
.changes h2 { font-size: 15px; margin: 0; }
.changes__since { color: var(--faint); font-size: 12.5px; }
.changes__sum { display: flex; gap: 6px; flex-wrap: wrap; }
.changes__sum span { font-size: 12px; font-weight: 600; color: var(--d); background: color-mix(in srgb, var(--d) 12%, transparent); padding: 2px 8px; border-radius: 999px; }
.changes__body { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; padding: 4px 16px 16px; border-top: 1px solid var(--border); }
.changes__col h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--d); margin: 12px 0 6px; }
.changes__col ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 320px; overflow: auto; }
.changes__col li { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.changes__col li code { color: var(--text); }
.changes__col li small { color: var(--faint); }
.jump { border: 0; background: none; padding: 0; text-decoration: underline dotted; text-underline-offset: 3px; }
.jump:hover { color: var(--accent); }
.changes--none { padding: 10px 16px; color: var(--faint); font-size: 13px; }

.chip--core { --c: var(--p-locked); }
.pbadge { font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 6px; color: var(--p); background: color-mix(in srgb, var(--p) 12%, transparent); white-space: nowrap; }
.core-groups { display: grid; gap: 12px; }
.core-group { --p: var(--p-core); background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--p); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; display: grid; gap: 8px; }
.core-group[data-level="locked"] { --p: var(--p-locked); }
.core-group__head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.core-group__head h3 { margin: 0; font-size: 14.5px; }
.core-group__head span { color: var(--faint); font-size: 12.5px; }
.core-group p { margin: 0; font-size: 13px; color: var(--muted); }
.core-group p b { color: var(--text); font-weight: 600; }
.core-files { display: flex; flex-wrap: wrap; gap: 4px; }
.core-files a { text-decoration: none; }
.core-files a:hover { border-color: var(--accent); color: var(--accent); }
.core-files .tag[data-change] { color: var(--d); border-color: color-mix(in srgb, var(--d) 50%, var(--border)); }
.core-group details > summary { cursor: pointer; font-size: 12.5px; color: var(--faint); margin-bottom: 6px; }
.core-policy { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; margin-bottom: 14px; }
.core-policy div { --p: var(--p-core); font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.core-policy div:first-child { --p: var(--p-locked); }
.core-policy b { color: var(--p); }

.settings { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
.empty { text-align: center; padding: 80px 20px; color: var(--faint); }
.empty b { display: block; font-size: 16px; color: var(--muted); margin-bottom: 4px; }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 20px); opacity: 0; background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; transition: all .2s; pointer-events: none; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toast.is-on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 1000px) {
  .layout { grid-template-columns: minmax(0, 1fr); padding: 16px; }
  .brand { flex-basis: 100%; flex-wrap: wrap; row-gap: 0; }
  .search { flex-basis: 0; }
  .result-count { margin-left: 0; flex-basis: 100%; }
  html { scroll-padding-top: 190px; }
  .sidebar { display: none; }
  .steps { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .step { padding: 8px 12px; }
  .topbar__inner { padding: 12px 16px; }
  .grid, .settings { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>

ispatch a bare CustomEvent for these; use the constants and event classes so payload shapes stay consistent.","keywords":"events, ThemeEvents, event names, variant update, cart update, cart add, cart error, filter update, quantity selector, discount, media playing, dispatchEvent, pub sub","note":"","usage":[],"copy":"src/js/modules/events.js","protect":{"level":"locked","group":"JS engine"}},{"kind":"js","name":"image-coordinator","file":"src/js/modules/image-coordinator.js","hash":"f9fd359b42a7","desc":"Shared observer pool for images — a single IntersectionObserver (lazy load, fires before the viewport) plus a single ResizeObserver (RAF-throttled width callbacks, sub-pixel noise filtered) serving all responsive images, instead of one observer pair per image.","when":"Any component that lazy-loads media or needs an image/wrapper width on resize — register with @theme/image-coordinator instead of creating its own IntersectionObserver/ResizeObserver (this is what the responsive-image element uses).","keywords":"image coordinator, lazy load, IntersectionObserver, ResizeObserver, shared observer, responsive image, viewport, resize width, performance","note":"","usage":[],"copy":"src/js/modules/image-coordinator.js","protect":{"level":"locked","group":"JS engine"}},{"kind":"js","name":"morph","file":"src/js/modules/morph.js","hash":"76feac74367f","desc":"DOM morphing engine — diffs an existing DOM tree against new markup (Node or HTML string) and applies minimal in-place changes, preserving initialized web components (shadow templates skipped), open details/aria-expanded state, and calling updatedCallback on morphed components so they can re-sync.","when":"Whenever fetched HTML must replace live DOM without a destructive innerHTML swap — variant updates, cart re-renders, filter results. For whole sections prefer sectionRenderer.renderSection / morphSection from @theme/section-renderer (both delegate here); use morph directly for arbitrary fragments.","keywords":"morph, ad of, the ThemeEvents Cart*Event. Do NOT dispatch a standard cart event for a change made through `Shopify.actions.updateCart`: the action runtime auto-emits those itself (listeners would see it twice).","keywords":"standard events, storefront events, storefront actions, Shopify.actions, openCart, updateCart, getCart, shopify:cart:lines-update, shopify:cart:note-update, shopify:cart:discount-update, shopify:cart:error, shopify:product:select, shopify:collection:update, shopify:search:update, shopify:cart:attributes-update, shopify:page:view, shopify:product:view, product filters mapping, sort key mapping, app integration, agent integration","note":"","usage":[],"copy":"src/js/modules/standard-events.js","protect":{"level":"core","group":"JS feature modules"}},{"kind":"js","name":"theme","file":"src/js/global/theme.js","hash":"da39a3ee5e6b","desc":"","when":"","keywords":"","note":"","usage":[],"copy":"src/js/global/theme.js","protect":{"level":"core","group":"JS bootstrap"}},{"kind":"js","name":"utilities","file":"src/js/modules/utilities.js","hash":"3150a40f6922","desc":"Grab-bag of shared helpers every module leans on: breakpoint media queries (mediaQueryMobile/Tablet/Desktop, is*Breakpoint, prefersReducedMotion), timing (debounce, throttle, requestIdleCallback, scheduler), fetchConfig for Shopify AJAX requests, money formatting (formatShopifyMoney, formatCurrency), storage (get/setLocalStorage, CookieManager), focus management (trapFocus, getFocusableElements, cycleFocus), DOM waiting (onDocumentReady, onAnimationEnd, waitForMediaReady, waitForEvent), viewport/geometry checks (getVisibleElements, coordinatedInView, isClickedOutside), device detection (isTouch, isSafari, getIOSVersion, isRTL), getSectionId, viewTransition, Tooltip and Lenis accessors, ResizeNotifier.","when":"Before hand-rolling ANY generic helper — a debounce, a breakpoint check, a fetch header builder, a focus trap, a money formatter — it almost certainly already exists here; import it instead. id: 'product-finder-button' %}"},{"kind":"private","name":"_product-finder-field","file":"blocks/_product-finder-field.liquid","hash":"38a7171808ca","desc":"Product finder field — Internal cascade field for `product-finder`.","note":"","usage":["blocks/product-finder"],"copy":"{% content_for 'block', type: '_product-finder-field', id: 'product-finder-field' %}"},{"kind":"private","name":"_product-finder-heading","file":"blocks/_product-finder-heading.liquid","hash":"f30997ba5b4b","desc":"Product finder heading — Internal heading block for `product-finder` (STATIC — rendered by the parent via `{% content_for 'block', type: '_product-finder-heading', id: 'product-finder-heading' %}`).","note":"","usage":["blocks/product-finder"],"copy":"{% content_for 'block', type: '_product-finder-heading', id: 'product-finder-heading' %}"},{"kind":"private","name":"_product-quiz-email","file":"blocks/_product-quiz-email.liquid","hash":"35285cbea82f","desc":"Email step — Email step of the product quiz (STATIC, shared by `sections/finder-quiz.liquid` and `sections/recommendation-quiz.liquid`). Hidden with the editor's eye toggle, it renders nothing and the last question goes straight to the results.","note":"","usage":["sections/finder-quiz","sections/recommendation-quiz"],"copy":"{% content_for 'block', type: '_product-quiz-email', id: 'product-quiz-email' %}"},{"kind":"private","name":"_product-quiz-image","file":"blocks/_product-quiz-image.liquid","hash":"c30805716d13","desc":"Image — Image of the product quiz intro (STATIC child of `blocks/_product-quiz-intro.liquid`, never added by hand). With no image picked (desktop or mobile) it renders the theme's placeholder SVG in the same `.media` box, on the storefront too, so `image_ratio` (1:1 under `adapt`), `border_radius` and the intro's position / alignment all show on it. Hiding this static block (eye toggle) is how to get a text-only intro: it then renders nothing and the intro lays its text out full width. The corner radius is this block's own `border_radius` (`--product-quiz-image-radius`).","note":"","usage":["sections/finder-quiz","sections/recommendation-quiz"],"copy":"{% content_for 'block', type: '_product-quiz-image', id: 'product-quiz-image' %}"},{"kind":"private","name":"_product-quiz-intro","file":"blocks/_product-quiz-intro.liquid","hash":"6aa2ba6a7e72","desc":"Intro — Intro screen of the product quiz (STATIC, shared by `sections/finder-quiz.liquid` and `sections/recommendation-quiz.liquid`). Hidden with the editor's eye toggle, it renders nothing and the quiz starts on its first question. A container like `group`: the copy is dynamic `text` children (plus optional `_content-label` pills, e.g. an eyebrow above the heading; their look is the global Label theme settings), all rendered in merchant order inside `[data-quiz-copy]`. The Start button is the static `_product-quiz-start-button` block (`start-button`: a `\u003cbutton type=\"button\">` with no Link setting) and the picture is the static `_product-quiz-image` block (`image`). A blank image renders a placeholder; only a hidden Image block renders nothing, so the text column goes full width.","note":"","usage":["sections/finder-quiz","sections/recommendation-quiz"],"copy":"{% content_for 'block', type: '_product-quiz-intro', id: 'product-quiz-intro' %}"},{"kind":"private","name":"_product-quiz-results","file":"blocks/_product-quiz-results.liquid","hash":"f8c1fe81ea3c","desc":"Results — Results screen of the product quiz (STATIC, always rendered by `sections/finder-quiz.liquid` and `sections/recommendation-quiz.liquid`). A thin wrapper: all markup lives in `snippets/product-quiz-results-markup.liquid`, which the shell also renders BARE (no block) when the merchant hides this block. The result rows are box product cards painted with this block's own row colour scheme and radius (never the theme's global box card scheme).","note":"","usage":["sections/finder-quiz","sections/recommendation-quiz"],"copy":"{% content_for 'block', type: '_product-quiz-results', id: 'product-quiz-results' %}"},{"kind":"private","name":"_product-quiz-start-button","file":"blocks/_product-quiz-start-button.liquid","hash":"1d5c5fd36d9c","desc":"Start button — Start button of the product quiz intro (STATIC child of `blocks/_product-quiz-intro.liquid`, never added by hand: no presets). Start is an action, not a link, so this block has no Link setting and always renders a real `\u003cbutton type=\"button\">` through `button-markup`. The intro wraps it in `[data-quiz-start]` (`on:click=\"product-quiz/start\"`); in the Finder quiz the runtime toggles `btn--loading` on the `\u003cbutton>` while the first question is pre-fetched, which reveals the spinner passed in through `content_after`.","note":"","usage":["sections/finder-quiz","sections/recommendation-quiz"],"copy":"{% content_for 'block', type: '_product-quiz-start-button', id: 'product-quiz-start-button' %}"},{"kind":"private","name":"_recommendation-quiz-option","file":"blocks/_recommendation-quiz-option.liquid","hash":"b7793ae8042c","desc":"Option — One answer card of a Recommendation quiz question (dynamic, whitelisted by `_recommendation-quiz-question`).","note":"","usage":["blocks/_recommendation-quiz-question","sections/recommendation-quiz"],"copy":"{% content_for 'block', type: '_recommendation-quiz-option', id: 'recommendation-quiz-option' %}"},{"kind":"private","name":"_recommendation-quiz-question","file":"blocks/_recommendation-quiz-question.liquid","hash":"9184b0c55d05","desc":"Question — One Recommendation quiz question (dynamic, whitelisted by `sections/recommendation-quiz.liquid`).","note":"","usage":["sections/recommendation-quiz"],"copy":"{% content_for 'block', type: '_recommendation-quiz-question', id: 'recommendation-quiz-question' %}"},{"kind":"snippet","name":"product-finder-markup","file":"snippets/product-finder-markup.liquid","hash":"9ff4194c1bcb","desc":"Presentation shell for the `product-finder` block.","usage":["blocks/product-finder"],"copy":"{% render 'product-finder-markup' %}"},{"kind":"snippet","name":"product-quiz-option-markup","file":"snippets/product-quiz-option-markup.liquid","hash":"640511cebe50","desc":"Shared markup of one product-quiz answer card, rendered by `blocks/_finder-quiz-option.liquid` and `blocks/_recommendation-quiz-option.liquid`.","usage":["blocks/_finder-quiz-option","blocks/_recommendation-quiz-option"],"copy":"{% render 'product-quiz-option-markup' %}"},{"kind":"snippet","name":"product-quiz-question-markup","file":"snippets/product-quiz-question-markup.liquid","hash":"4be332ce28e4","desc":"Shared markup of one product-quiz question, rendered by `blocks/_finder-quiz-question.liquid` and `blocks/_recommendation-quiz-question.liquid`.","usage":["blocks/_finder-quiz-question","blocks/_recommendation-quiz-question"],"copy":"{% render 'product-quiz-question-markup' %}"},{"kind":"snippet","name":"product-quiz-results-markup","file":"snippets/product-quiz-results-markup.liquid","hash":"68e2ba49fec2","desc":"Results screen of the product quiz, shared by `blocks/_product-quiz-results.liquid` (the full screen, from its settings) and `snippets/product-quiz-shell.liquid` (a BARE screen when the merchant hid the Results block: the list + Retake only, so the quiz never dead-ends).","usage":["blocks/_product-quiz-results","snippets/product-quiz-shell"],"copy":"{% render 'product-quiz-results-markup' %}"},{"kind":"snippet","name":"product-quiz-row","file":"snippets/product-quiz-row.liquid","hash":"e0be4bf41b14","desc":"One product-quiz result: the reused horizontal product card with an icon-only quick-add button (single-variant products add directly, multi-variant ones open the quick-view modal).","usage":["sections/section-rendering-product-quiz","snippets/product-quiz-results-markup"],"copy":"{% render 'product-quiz-row' %}"},{"kind":"snippet","name":"product-quiz-shell","file":"snippets/product-quiz-shell.liquid","hash":"02177dcd0e8d","desc":"Shared shell of the product quiz sections (`sections/finder-quiz.liquid`, `sections/recommendation-quiz.liquid`): section wrapper, `\u003cproduct-quiz>` root, progress UI and the question panels, around the static intro / email / results screens.","usage":["sections/finder-quiz","sections/recommendation-quiz"],"copy":"{% render 'product-quiz-shell' %}"},{"kind":"snippet","name":"product-quiz-strip-tokens","file":"snippets/product-quiz-strip-tokens.liquid","hash":"c4c748775a6d","desc":"Removes `[question_id]` tokens from a product-quiz question heading / subtext for the server-side first paint, so a raw `[make]` never shows before (or without) JavaScript. The runtime re-renders the copy from `data-template` with the shopper's answers each time the question is shown.","usage":["snippets/product-quiz-question-markup"],"copy":"{% render 'product-quiz-strip-tokens' %}"},{"kind":"js","name":"product-finder","file":"src/js/modules/product-finder.js","hash":"6c8b510c7473","desc":"","when":"","keywords":"","note":"\u003cproduct-finder>","usage":[],"copy":"\u003cproduct-finder>\u003c/product-finder>","protect":{"level":"core","group":"JS feature modules"}},{"kind":"js","name":"product-quiz","file":"src/js/modules/product-quiz.js","hash":"b92831fd0c61","desc":"Multi-step product quiz / finder wizard — intro → one question per screen (radio cards) → optional email capture (customer form + answer tags, native submit so Shopify's hCaptcha runs; answers kept in sessionStorage and restored on return) → recommended product rows; bar or stepper progress, per-option branching (skip questions), two result sources (store-filter cascade over one collection with live option counts, or per-option strong/partial/exclude product lists), fallback products, [question_id] tokens + answer summary, theme-editor block-select.","when":"Any \"find the right product\" questionnaire or guided selling flow. Reuse one of the two sections and restyle it: sections/finder-quiz.liquid (store-filter cascade, data-results-source=\"filter\") or s eadcrumbs","blocks/_breadcrumbs"],"copy":"{% render 'breadcrumbs' %}"},{"kind":"snippet","name":"desktop-menu","file":"snippets/desktop-menu.liquid","hash":"ddb794be1e62","desc":"Renders the primary desktop navigation bar. Iterates over menu.links and matches each link against the provided blocks by title handle to decide whether to render a mega-menu dropdown or a standard dropdown.","usage":["sections/header"],"copy":"{% render 'desktop-menu' %}"},{"kind":"snippet","name":"desktop-menu-dropdown","file":"snippets/desktop-menu-dropdown.liquid","hash":"5028d696d933","desc":"Renders a standard desktop navigation dropdown for a top-level menu link that has child links (but is not a mega menu). Outputs a `\u003cdetails is=\"details-dropdown\">` with the top link as summary and its child/grandchild links nested inside `.dropdown`.","usage":["snippets/desktop-menu"],"copy":"{% render 'desktop-menu-dropdown' %}"},{"kind":"snippet","name":"desktop-menu-dropdown-item","file":"snippets/desktop-menu-dropdown-item.liquid","hash":"6f359dae6893","desc":"Renders a single desktop menu link as a list item (`\u003cli>`). Expected to be rendered inside a `\u003cul>` — used for leaf links such as child and grandchild links in the desktop mega menu dropdowns.","usage":["snippets/desktop-menu-dropdown"],"copy":"{% render 'desktop-menu-dropdown-item' %}"},{"kind":"snippet","name":"dropdown-localization","file":"snippets/dropdown-localization.liquid","hash":"1ebb550dfeed","desc":"Determines whether to wrap the localization-form in a dropdown-component and passes variables to it.","usage":["sections/footer","blocks/_localization","snippets/menu-drawer"],"copy":"{% render 'dropdown-localization' %}"},{"kind":"snippet","name":"header-logo","file":"snippets/header-logo.liquid","hash":"3fac0aca0fd2","desc":"Renders the header logo as either an image or a text fallback. On the homepage the wrapper is an \u003ch1>; on all other pages it is a \u003cdiv>. Supports separate desktop and mobile logo i a-menu-text-with-banners","snippets/menu-drawer"],"copy":"{% render 'menu-drawer-details' %}"},{"kind":"snippet","name":"menu-drawer-sublinks","file":"snippets/menu-drawer-sublinks.liquid","hash":"4cbd49b81ba5","desc":"Renders the child-link list (`\u003cul class=\"menu-drawer__list\">`) for a mobile menu-drawer panel. Shared by the generic `menu-drawer-details` fallback and by each `_mega-menu-*` block's inline mobile markup, so the sub-link scaffold lives in one place.","usage":["blocks/_mega-menu-banner","blocks/_mega-menu-sidebar","blocks/_mega-menu-text-with-banners","snippets/menu-drawer"],"copy":"{% render 'menu-drawer-sublinks' %}"},{"kind":"js","name":"details-dropdown","file":"src/js/modules/details-dropdown.js","hash":"d6851660d212","desc":"Animated dropdown built on native \u003cdetails> — click or debounced-hover open (hover falls back to click on touch), outside-click/Escape/focus-out close, animated show/hide, viewport-edge overflow flip (.needs-reverse), and body class \"dropdown-open\" while open.","when":"Header nav dropdowns, sort/filter menus, language/currency pickers — any disclosure that opens a floating panel from a trigger. Use the trigger=\"hover\" attribute for hover menus; summary data-link makes hover-triggered summaries navigate on click.","keywords":"dropdown, details summary, disclosure, hover menu, nav dropdown, sort menu, popover panel, open on hover, click outside close, flyout","note":"\u003cdetails-dropdown>","usage":[],"copy":"\u003cdetails-dropdown>\u003c/details-dropdown>","protect":{"level":"core","group":"JS feature modules"}},{"kind":"js","name":"details-mega","file":"src/js/modules/details-dropdown.js","hash":"d6851660d212","desc":"Full-width mega-menu variant of details-dropdown — slides the panel down/up with a translateY transition, stacks z-index so a newly opened menu covers a closing one, ref-counts the \"mega-menu-open\"/\"mega-menu-closing\" body classes, and auto-opens on theme-editor block select.","when":"Header oduct-card-bundle-markup' %}"},{"kind":"snippet","name":"product-card-fbt-markup","file":"snippets/product-card-fbt-markup.liquid","hash":"3db2cc38ac2c","desc":"Renders a product card for any multi-product add-to-cart context (Frequently Bought Together, bought-together panels, bundle pickers). Resolves the featured image from the selected variant first, then falls back to product.featured_media.","usage":["blocks/_product-fbt"],"copy":"{% render 'product-card-fbt-markup' %}"},{"kind":"snippet","name":"product-card-markup","file":"snippets/product-card-markup.liquid","hash":"bde1220923a1","desc":"Renders a product card with vertical or horizontal layout, independently configurable per breakpoint.","usage":["sections/product-tabs","blocks/_menu-mega-products","blocks/_product-card","blocks/_product-recommendations","blocks/product-card","snippets/cart-drawer-recommendation","snippets/lookbook-card","snippets/predictive-search-products-carousel-markup","snippets/product-quiz-row"],"copy":"{% render 'product-card-markup' %}"},{"kind":"snippet","name":"product-card-metas","file":"snippets/product-card-metas.liquid","hash":"5fb8fa266718","desc":"Renders product card vendor and type links inside `.product-card__metas`. Outputs nothing when both are disabled or blank.","usage":["snippets/product-card-bundle-markup","snippets/product-card-fbt-markup","snippets/product-card-markup","snippets/product-card-selection-markup"],"copy":"{% render 'product-card-metas' %}"},{"kind":"snippet","name":"product-card-placeholder","file":"snippets/product-card-placeholder.liquid","hash":"52bc01314f40","desc":"A card-shaped skeleton shown while a product list is fetched (product recommendations section/block). Media box at the card's aspect ratio plus a title line and a price line, so the fetched card lands close to the same height — a bare ratio box is far shorter than a card with its text.","usage":["sections/product-recently-viewed","sections/product-recommendations","blocks/_product-recommendations","snippets/predictive-search-recommendation-placeholder-markup"],"copy":"{% render 'product-card-placeholder' %}"},{"kind":"snippet","name":"product-card-selection-markup","file":"snippets/product-card-selection-markup.liquid","hash":"9d4791de7c02","desc":"Renders the HTML markup for a selectable product card used in multi-product selection UIs. Determines the variant-level URL by matching the featured media to a variant. Handles combined listings (linked products via option values) and no-swatch-selected state. Supports hover second image, image ratio, badges, vendor, and type.","usage":[],"copy":"{% render 'product-card-selection-markup' %}"},{"kind":"snippet","name":"product-card-variant-url","file":"snippets/product-card-variant-url.liquid","hash":"e3f738e722e3","desc":"Logic to determine which variant URL to use (matching swatch selection logic)","usage":["snippets/product-card-bundle-markup","snippets/product-card-fbt-markup","snippets/product-card-markup","snippets/product-card-selection-markup"],"copy":"{% render 'product-card-variant-url' %}"},{"kind":"snippet","name":"product-card-volume-popover","file":"snippets/product-card-volume-popover.liquid","hash":"1ba2369b2197","desc":"Display tooltip for quantity rules & volume pricing","usage":["snippets/product-card-bundle-markup","snippets/product-card-fbt-markup","snippets/quick-order-list-row"],"copy":"{% render 'product-card-volume-popover' %}"},{"kind":"snippet","name":"quick-add","file":"snippets/quick-add.liquid","hash":"69f98f0b7571","desc":"Renders the quick add to cart component for mode='combine'. - Single-option or single-variant products: ATC button via \u003cquick-add-component> - Multi-variant products: \"Choose options\" button via \u003cquick-view-component> (opens drawer)","usage":["snippets/product-card-markup"],"copy":"{% render 'quick-add' %}"},{"kind":"snippet","name":"swatch","file":"snippets/swatch.liquid","hash":"9fae2061458b","desc":"Renders a swatch","usage":["snippets/c me-editor + morph (updatedCallback) survival.","when":"Any sliding/scrolling gallery of slides: product carousels, image sliders, testimonial sliders, logo rows with arrows. Reuse this element + config JSON — never instantiate the raw Swiper library in a section. Extend it (like flex-carousel, carousel-centered-slider) for variant behaviour. Pairs with src/scss/global/_component-carousel.scss.","keywords":"carousel, slider, slideshow, swiper, slides, gallery, autoplay, navigation arrows, pagination dots, thumbnails, loop, per-view, breakpoints, testimonial slider, product slider","note":"\u003ccarousel-slider>","usage":[],"copy":"\u003ccarousel-slider>\u003c/carousel-slider>","protect":{"level":"core","group":"JS feature modules"}},{"kind":"js","name":"flex-carousel","file":"src/js/modules/flex-carousel.js","hash":"229c78cd1200","desc":"Swiper-backed carousel that also drives .edge__shadows edge-fade state — toggles is--active/is--beginning/is--end from the Swiper instance's reachBeginning/reachEnd/fromEdge events (main and thumbnail swipers).","when":"A carousel whose overflowing row needs the scheme-aware gradient fade at each edge (src/scss/global/_component-edge-shadows.scss). For a plain CSS-scroll row (tabs, pills) use swipe-component instead — same three classes, no Swiper. Building a carousel that rewrites the strip behind Swiper's back (cloning slides for a manual loop, tearing the instance down past a breakpoint)? Extend this class instead of re-deriving the state — carousel-centered-slider.js is the worked example.","keywords":"carousel edge fade, gradient fade, scroll shadow, overflow hint, edge shadows, swiper edges, fade at edges, carousel overflow indicator","note":"\u003cflex-carousel>","usage":[],"copy":"\u003cflex-carousel>\u003c/flex-carousel>","protect":{"level":"core","group":"JS feature modules"}},{"kind":"js","name":"slideshow","file":"src/js/modules/slideshow.js","hash":"766fd8f26678","desc":"Hero slideshow on top of the Swiper CarouselComponent — per-slide it swaps the controls' color scheme, pauses/plays each slide's deferred-media video, releases the active slide's held entrances for their first run at load, runs every non-drag slide change in sequence (the outgoing slide's text leaves first on --motion-slide-exit / --motion-slide-exit-ease / --motion-slide-exit-distance, then the slide changes and the incoming entrances play), and exposes the active slide via a `selected-index` attribute.","when":"Full-width hero/slideshow sections where each slide has its own color scheme, video, or animated content. Pairs with src/scss/global/_section-slideshow.scss. Extend/reuse this rather than re-wiring Swiper events for slide-scoped media and motion.","keywords":"slideshow, hero slider, banner carousel, autoplay video slide, per-slide color scheme, slide change, motion replay, swiper, image slider","note":"\u003cslideshow-component>","usage":[],"copy":"\u003cslideshow-component>\u003c/slideshow-component>","protect":{"level":"core","group":"JS feature modules"}},{"kind":"js","name":"swiper","file":"src/js/library/swiper.js","hash":"5fe2f67e3708","desc":"Vendored Swiper library bundle — exports the raw Swiper class plus the Navigation, Pagination, Mousewheel, Autoplay, EffectFade and A11y modules, consumed via the @theme/swiper import alias.","when":"NEVER use directly from a section or new module — build on \u003ccarousel-slider> (CarouselComponent in carousel.js), which owns configuration, lifecycle, morph survival and accessibility on top of this library. Import from @theme/swiper only when extending the carousel infrastructure itself.","keywords":"swiper library, slider engine, carousel engine, vendored dependency, swiper modules, autoplay module, effect fade, third-party bundle","note":"","usage":[],"copy":"src/js/library/swiper.js","protect":{"level":"locked","group":"Thư viện bên thứ ba"}},{"kind":"scss","name":"component-carousel","file":"src/scss/global/_component-carousel.scss","hash":"a51174b74b84","desc":"Swiper carousel chrome — prev/next nav buttons (inline group, absolute overlay revealed on hover/focus, nav-end layout), slide counter, every pagination style (bullets, dynamic bullets, pill, pill-autoplay fill, scale, progress bar + autoplay variant), controls alignment, and whether the strip overflows its box or is clipped. Mobile-only overrides throughout.","when":"Any Swiper-based slider/carousel controls; pairs with src/js/modules/carousel.js and flex-carousel.js (Swiper init, --autoplay-progress). Never restyle Swiper bullets or hand-roll nav arrows. Sections drive all of this from the shared `carousel_*` settings via snippets/carousel-controls.liquid + snippets/carousel-class.liquid — reach for those before emitting these classes by hand.","keywords":"carousel, slider, swiper, nav arrows, prev next, pagination dots, bullets, progress bar, autoplay indicator, slide counter, hover reveal arrows","note":"Gộp vào theme.css","usage":[],"copy":"src/scss/global/_component-carousel.scss"},{"kind":"scss","name":"section-flex-carousel","file":"src/scss/global/_section-flex-carousel.scss","hash":"fdb879f1d720","desc":"","when":"","keywords":"","note":"Gộp vào theme.css","usage":[],"copy":"src/scss/global/_section-flex-carousel.scss"},{"kind":"scss","name":"slideshow","file":"src/scss/scoped/slideshow.scss","hash":"17c2957a6bd1","desc":"","when":"","keywords":"","note":"→ assets/scoped-slideshow.css (section tự nạp)","usage":[],"copy":"src/scss/scoped/slideshow.scss"},{"kind":"scss","name":"swiper","file":"src/scss/modules/swiper.scss","hash":"dc4c8bb1e304","desc":"","when":"","keywords":"","note":"→ assets/swiper.css (bundle riêng)","usage":[],"copy":"src/scss/modules/swiper.scss"}]},{"id":"hero","title":"Banner & hero","need":"Hero banner, banner có nội dung/marquee","items":[{"kind":"section","name":"hero-banner","file":"sections/hero-banner.liquid","hash":"721db0d7a35c","desc":"Hero banner","note":"Section blocks: _hero-banner-marquee","usage":["collection.json"],"copy":"hero-banner"},{"kind":"private","name":"_hero-banner-content","file":"blocks/_hero-banner-content.liquid","hash":"48c7528b5621","desc":"Content","note":"","usage":["collection.json","sections/hero-banner"],"copy":"{% content_for 'block', type: '_hero-banner-content', id: 'hero-banner-content' %}"},{"kind":"private","name":"_hero-banner-marquee","file":"blocks/_hero-banner-marquee.liquid","hash":"8b6e72261cab","desc":"Marquee","note":"Editor category: Banners","usage":["sections/hero-banner"],"copy":"{% content_for 'block', type: '_hero-banner-marquee', id: 'hero-banner-marquee' %}"},{"kind":"private","name":"_hero-banner-media","file":"blocks/_hero-banner-media.liquid","hash":"adb28f3a9c64","desc":"Media","note":"","usage":["collection.json"],"copy":"{% content_for 'block', type: '_hero-banner-media', id: 'hero-banner-media' %}"},{"kind":"scss","name":"hero-banner","file":"src/scss/scoped/hero-banner.scss","hash":"ca0fc33146d7","desc":"","when":"","keywords":"","note":"→ assets/scoped-hero-banner.css (section tự nạp)","usage":[],"copy":"src/scss/scoped/hero-banner.scss"}]},{"id":"motion","title":"Animation & motion","need":"Hiệu ứng khi cuộn (data-motion), stagger, page transition, smooth scroll, parallax","items":[{"kind":"snippet","name":"motion-attributes","file":"snippets/motion-attributes.liquid","hash":"6d6ece04a8f1","desc":"Emits the motion attribute set for one element. The ONLY place Liquid turns a setting into motion markup.","usage":["sections/collection-list","sections/featured-collection","sections/flex-carousel","sections/product-recommendations","sections/product-tabs","blocks/_collection-tab-content","blocks/_content-label","blocks/label","snippets/featured-collection-markup","snippets/text-markup"],"copy":"{% render 'motion-attributes' %}"},{"kind":"snippet","name":"motion-boot","file":"snippets/motion-boot.liquid","hash":"b3a11079d725","desc":"Arms the motion prestage, and disarms it if the motion runtime never boots.","usage":["layout/password","layout/theme"],"copy":"{% render 'motion-boot' %}"},{"kind":"snippet","name":"motion-prestage","file":"snippets/motion-prestage.liquid","hash":"5fdbcfb0821e","desc":"","usage":["snippets/critical-css"],"copy":"{% render 'motion-prestage' %}"},{"kind":"js","name":"animation","file":"src/js/library/animation.js","hash":"233c889b4d1c","desc":"Vendored Motion (motion.dev) animation library — exports animate, stagger, inView and scroll, consumed via the @theme/animation import alias.","when":"Programmatic tween/spring animations, scroll-linked effects and in-view triggers. Prefer the declarative layer first — \u003cmotion-component> (data-motion presets) and coordinatedInView via @theme/motion-coordinator, which budget concurrent animations; import @theme/animation directly only for bespoke animation logic those cannot express.","keywords":"animation, motion, tween, spring, scroll-linked, in view, stagger, animate, motion.dev","note":"","usage":[],"copy":"src/js/library/animation.js","protect":{"level":"locked","group":"Thư viện bên thứ ba"}},{"kind":"js","name":"lenis","file":"src/js/library/lenis.js","hash":"26997ef8a176","desc":"Vendored Lenis (lenis.darkroom.engineering) smooth-scroll library — exports Lenis, consumed via the @theme/lenis import alias and never imported directly by a component.","when":"Only `getLenis()` in utilities constructs it, and only when the merchant setting, the device and prefers-reduced-motion all allow it. Everything else asks `getLenis()` and degrades to window.scrollY when it returns null.","keywords":"lenis, smooth scroll, scroll smoothing, wheel, inertia, scroll hijacking, momentum","note":"","usage":[],"copy":"src/js/library/lenis.js","protect":{"level":"locked","group":"Thư viện bên thứ ba"}},{"kind":"js","name":"motion-component","file":"src/js/modules/motion-component.js","hash":"06648ba1e661","desc":"Declarative scroll-reveal wrapper for ONE element — plays a named entrance from the motion registry when the element enters the viewport, coordinated through motionCoordinator; waits for inner media, re-animates after section morph, honours prefers-reduced-motion, and reveals itself rather than staying hidden if the animation budget is full.","when":"ANY \"animate on scroll\" / reveal effect on section or block content — wrap the content instead of writing IntersectionObserver + keyframes by hand. For a LIST whose items should arrive in sequence use motion-group, which costs one budget slot instead of N. See the animation-motion skill.","keywords":"animate on scroll, scroll reveal, fade in, fade up, slide in, zoom in, entrance animation, in-view animation, motion effect, AOS","note":"\u003cmotion-component>","usage":[],"copy":"\u003cmotion-component>\u003c/motion-component>","protect":{"level":"core","group":"JS feature modules"}},{"kind":"js","name":"motion-controller","file":"src/js/modules/motion-controller.js","hash":"a0276b064d8e","desc":"The public motion API — play, replay, reset, reveal, disable and enable any entrance from anywhere, plus replayWithin(container) and swapWithin(from, to) (outgoing headings leave word by word before the incoming ones arrive) for the cases in-view cannot cover: a modal that just opened, a filter that just swapped its results, a section the Section Rendering API just morphed.","when":"A host needs to drive motion it does not own. Reach for FoxTheme.motion.replayWithin(el) instead of hunting for motion elements and poking at them — the components' own methods are an implementation detail, and this is the surface that stays stable.","keywords":"motion api, replay animation, replayWithin, modal animation, filter results animation, reset motion, reveal, disable animation, FoxTheme.motion, debug motion, inspect motion, above the fold","note":"","usage":[],"copy":"src/js/modules/motion-controller.js","protect":{"level":"core","group":"JS feature modules"}},{"kind":"js","name":"motion-group","file":"src/js/modules/motion-group.js","hash":"85c6eccb2c32","desc":"Staggered entrance for a LIST — fades its cells in one after another (fade-up or plain fade) instead of the list appearing at once; runs on scroll-into-view AND on demand via replay(), so the same effect covers a card grid revealing itself and a tab panel the visitor just switched to.","when":"Any repeated row/grid whose items should arrive in sequence: product grids, collection lists, article cards, tab panels full of cards. Reach for this INSTEAD of putting a \u003cmotion-component> around every card — one group costs one animation budget slot and one animation for the whole list, where N wrappers spend N slots and N animations on the same cascade.","keywords":"stagger, staggered animation, cascade, sequence, one by one, card grid animation, list entrance, fade up cards, tab panel animation, reveal grid","note":"\u003cmotion-group>","usage":[],"copy":"\u003cmotion-group>\u003c/motion-group>","protect":{"level":"core","group":"JS feature modules"}},{"kind":"js","name":"motion-presets","file":"src/js/modules/motion-presets.js","hash":"cffa459ff139","desc":"The theme's motion vocabulary as DATA — every entrance kind (fade-in, fade-up, slide-in-start/end, zoom-in/out and their swap-speed variants) with its parameters, its intent and its cost, in one enumerable registry that the runtime animates from, the build generates prestage CSS from, and a fork extends without editing this file.","when":"Adding, tuning or choosing an entrance animation. Never hardcode opacity/transform values in a component — look the kind up here, or register a new one with FoxTheme.motion.registerPreset(). A kind's parameters live here and nowhere else, so \"the same fade-up\" cannot drift between two call sites.","keywords":"motion presets, animation registry, fade-in, fade-up, slide-in, zoom, entrance kinds, motion vocabulary, register preset, extend animation","note":"","usage":[],"copy":"src/js/modules/motion-presets.js","protect":{"level":"core","group":"JS feature modules"}},{"kind":"js","name":"motion-text","file":"src/js/modules/motion-text.js","hash":"fffc7a42ebb2","desc":"Split-text entrance — splits its text into words, each inside its own clipping box, and plays the block's entrance preset (fade-in, fade-up/down, slide-in) on them one after another as the text is scrolled to — a heading cascades as one; a text taller than half the viewport is paced by its lines, each line below the fold waiting until it is scrolled to; the cascade is capped so a long paragraph lands as quickly as a short heading; gradient-filled text (background-clip: text) keeps its colour while the words move; coordinated through motionCoordinator, replayable (replay / exit({ durationMs, easing }), with data-motion-exiting + exitTiming while it leaves) for slides, honours prefers-reduced-motion, and shows the text at once when the animation budget is full.","when":"Text whose entrance should run word by word. snippets/text-markup.liquid renders it when a text's animation_split is \"words\" — the effect itself is still the block's animation_type. Offer animation_split on a text block instead of hand-splitting text anywhere else.","keywords":"split text, word reveal, heading animation, text reveal, masked words, staggered words, title animation, slide heading","note":"\u003cmotion-text>","usage":[],"copy":"\u003cmotion-text>\u003c/motion-text>","protect":{"level":"core","group":"JS feature modules"}},{"kind":"js","name":"page-transition","file":"src/js/modules/page-transition.js","hash":"94ff38645889","desc":"Full-page loading curtain — an opaque overlay painted with the page's first frame that fades itself out as soon as this module runs, broadcasting ThemeEvents.pageLoaded / pageTransitionStart / pageTransitionEnd so other components can sequence their entrances (motion-coordinator holds every entrance until pageTransitionEnd; reduced-motion never paints the curtain; a CSS backstop lifts it even if this module never arrives; bfcache restores handled). There is no exit fade: unload only broadcasts pageTransitionStart.","when":"Themes with the page-transitions setting on; listen for ThemeEvents.pageTransitionEnd instead of DOMContentLoaded when something must start after the curtain clears. Pairs with src/scss/global/_component-page-transition.scss.","keywords":"page transition, loading overlay, fade in page, page load event, entrance sequencing, preloader, navigation fade, bfcache","note":"\u003cpage-transition>","usage":[],"copy":"\u003cpage-transition>\u003c/page-transition>","protect":{"level":"core","group":"JS feature modules"}},{"kind":"js","name":"parallax-component","file":"src/js/modules/parallax-component.js","hash":"b74e5a66bc18","desc":"Scroll-linked parallax for full-bleed media — drifts the image/video inside its clipping box as the section crosses the viewport. Four modes: vertical, horizontal and zoom move the media with a compensating scale so no edge is ever exposed; fixed pins it to the viewport instead, so the section's window slides across a still image (the background-attachment: fixed look, without its iOS and LCP costs). With data-parallax-entrance it also plays the theme's zoom-out entrance NATIVELY, on the media's individual `scale` property, so no wrapping motion-component (whose transform would break `fixed`) is needed. The moving modes run on a native ViewTimeline where the browser has one, so the compositor applies the drift in the same frame as the scroll (no one-frame lag behind Lenis); Motion One's scroll() is the fallback. Inert under prefers-reduced-motion and when no intensity is set.","when":"A hero/banner whose media should move against the page as you scroll. Wrap the media WRAPPER, not the clipping box — the box must stay still for the media to travel inside it. Not for entrance reveals (that is motion-component / data-motion) nor for the marquee's own scroll drift (marquee-component owns that).","keywords":"parallax, scroll effect, hero banner, banner motion, scroll-linked, drift, background movement, depth, zoom on scroll","note":"\u003cparallax-component>","usage":[],"copy":"\u003cparallax-component>\u003c/parallax-component>","protect":{"level":"core","group":"JS feature modules"}},{"kind":"js","name":"reveal-swap","file":"src/js/modules/reveal-swap.js","hash":"16ce4373d1a0","desc":"Swaps a server-rendered placeholder for fetched markup without the layout jump: morphs the host (children survive — a carousel re-initialises through updatedCallback with its inline styles intact, no flat frame), then holds the host at the placeholder height, measures the real one two frames later, and transitions between them while the new content fades in.","when":"Any host that renders a skeleton (product-card-placeholder) and fetches its real list later — product recommendations (section, block, cart drawer), recently viewed products, the predictive-search recommendations panel. Call this instead of innerHTML + a hand-rolled height transition.","keywords":"skeleton swap, placeholder reveal, fetched list height transition, morph fetched markup, async product list, layout shift, CLS","note":"","usage":[],"copy":"src/js/modules/reveal-swap.js","protect":{"level":"core","group":"JS feature modules"}},{"kind":"js","name":"scroll-progress-bar","file":"src/js/modules/scroll-progress-bar.js","hash":"f0143b9bb95a","desc":"Mobile-only horizontal scroll progress indicator — fills a bar to reflect how far a target scroll container has been scrolled sideways (RTL-aware, ResizeObserver-refreshed, auto-hides when nothing overflows or on desktop).","when":"A carousel/scroll row on mobile that needs a position indicator instead of dots or arrows — product grids that become scroll rows, chip rows, media strips. Reuse instead of computing scrollLeft percentages by hand.","keywords":"scroll progress, scrollbar indicator, carousel progress, horizontal scroll position, progress bar, scroll indicator, mobile carousel, swipe progress","note":"\u003cscroll-progress-bar>","usage":[],"copy":"\u003cscroll-progress-bar>\u003c/scroll-progress-bar>","protect":{"level":"core","group":"JS feature modules"}},{"kind":"scss","name":"component-lenis","file":"src/scss/global/_component-lenis.scss","hash":"ecd4913ad5ea","desc":"Smooth-scroll surface rules for Lenis — the stylesheet the library needs to work, kept in the theme's build rather than loaded as a second asset. Mirrors lenis/dist/lenis.css (v1.3.26).","when":"Present on every page; inert unless getLenis() constructed an instance, which adds .lenis to \u003chtml>. Never author against these classes — they are the library's, not the theme's.","keywords":"lenis, smooth scroll, scroll lock, overflow clip, autoToggle, data-lenis-prevent","note":"Gộp vào theme.css","usage":[],"copy":"src/scss/global/_component-lenis.scss"},{"kind":"scss","name":"component-page-transition","file":"src/scss/global/_component-page-transition.scss","hash":"67bc5875d84a","desc":"Full-viewport fixed loading curtain (GPU-promoted; the fade is driven by JS through the Web Animations API, with a delayed CSS keyframe as the no-JS / late-JS backstop).","when":"The page-transitions setting; pairs with src/js/modules/page-transition.js. Respect the body.page-transitions-enabled gate.","keywords":"page transition, navigation fade, overlay, loading curtain, route change animation","note":"Gộp vào theme.css","usage":[],"copy":"src/scss/global/_component-page-transition.scss"},{"kind":"scss","name":"component-parallax","file":"src/scss/global/_component-parallax.scss","hash":"f50abcb37f73","desc":"Scroll parallax surface styles for \u003cparallax-component> — pins the media to the viewport for the `fixed` mode with no script at all, and gives the three moving modes their own compositor layer so the drift cannot stutter.","when":"Paired with the parallax-component custom element on a full-bleed banner; never needed on its own. The moving modes still need the element's JS, the fixed mode does not.","keywords":"parallax, scroll effect, fixed background, pinned media, hero banner, clip-path, will-change, compositor layer","note":"Gộp vào theme.css","usage":[],"copy":"src/scss/global/_component-parallax.scss"},{"kind":"scss","name":"keyframes","file":"src/scss/global/_keyframes.scss","hash":"b40fef177921","desc":"Shared @keyframes library — slide in/out (left/right/bottom), dialog scale + backdrop fade, loading spin/rotator/dash, marquee scrolling (LTR + RTL), float up/down.","when":"Reuse an existing keyframe before declaring a new one — drawers/dialogs/marquee/spinners already animate with these; a duplicate keyframe with a new name is dead weight.","keywords":"keyframes, animation, slide in, slide out, fade, dialog animation, spinner, loading, marquee scroll, float","note":"Gộp vào theme.css","usage":[],"copy":"src/scss/global/_keyframes.scss"},{"kind":"scss","name":"motion-reduced","file":"src/scss/global/_motion-reduced.scss","hash":"7e031fcfeed5","desc":"Global prefers-reduced-motion floor — collapses every CSS transition and keyframe animation in the theme to a near-zero duration when the visitor asks for reduced motion, with a [data-motion-essential] opt-out for the handful of things that ARE the content (marquee, loading spinners).","when":"Never imported by hand — it is the last import in theme.scss and applies theme-wide. Add data-motion-essential to an element whose animation carries meaning rather than decoration; do NOT re-state a DURATION in a per-component prefers-reduced-motion block, which is what let twelve components each solve this differently and any new one forget entirely — a component block is only for what a duration clamp cannot reach, namely a custom property another layer reads (--dialog-duration) or an end state that should not happen at all (transform: scale(1)).","keywords":"reduced motion, prefers-reduced-motion, accessibility, a11y, motion sickness, vestibular, disable animation, marquee exception","note":"Gộp vào theme.css","usage":[],"copy":"src/scss/global/_motion-reduced.scss"}]},{"id":"marketing","title":"Marketing & nội dung","need":"Testimonial, icon box/list, countdown, counter, promotion alert, marquee, lookbook","items":[{"kind":"section","name":"icon-boxes","file":"sections/icon-boxes.liquid","hash":"a6f1b921cb0d","desc":"Icon boxes","note":"Section blocks: _icon-box","usage":[],"copy":"icon-boxes"},{"kind":"section","name":"testimonials","file":"sections/testimonials.liquid","hash":"35ba81335ab4","desc":"Testimonials","note":"Section blocks: testimonial","usage":[],"copy":"testimonials"},{"kind":"block","name":"countdown-icon-text","file":"blocks/countdown-icon-text.liquid","hash":"f8ebc16d7d41","desc":"Countdown timer","note":"Editor category: Basic","usage":[],"copy":"{% content_for 'block', type: 'countdown-icon-text', id: 'countdown-icon-text' %}"},{"kind":"block","name":"countdown-timer","file":"blocks/countdown-timer.liquid","hash":"196608edd0b9","desc":"Countdown timer","note":"Editor category: Basic","usage":["blocks/countdown-icon-text"],"copy":"{% content_for 'block', type: 'countdown-timer', id: 'countdown-timer' %}"},{"kind":"block","name":"counter","file":"blocks/counter.liquid","hash":"8435f3f667ec","desc":"Counter","note":"Editor category: Basic","usage":[],"copy":"{% content_for 'block', type: 'counter', id: 'counter' %}"},{"kind":"block","name":"icon-box","file":"blocks/icon-box.liquid","hash":"31c358913a33","desc":"Icon box — Icon box theme block. Visual options come from `block.settings`; the icon and the text content are static child blocks — a `_icon` block plus two `_text-plain` blocks (`heading` + `body`) the merchant edits in place.","note":"Editor category: Basic","usage":["blocks/scroll-row","footer-group.json","page.contact.json","page.help-center.json"],"copy":"{% content_for 'block', type: 'icon-box', id: 'icon-box' %}"},{"kind":"block","name":"icon-list","file":"blocks/icon-list.liquid","hash":"9917eb420c6e","desc":"Icon list","note":"Editor category: Basic","usage":[],"copy":"{% content_for 'b airs with src/scss/global/_component-accordion.scss.","keywords":"accordion, collapsible, expand collapse, faq, details summary, toggle section, single open, height animation, disclosure, collapse panel","note":"\u003caccordion-component>","usage":[],"copy":"\u003caccordion-component>\u003c/accordion-component>","protect":{"level":"core","group":"JS bootstrap"}},{"kind":"js","name":"back-to-top","file":"src/js/modules/back-to-top.js","hash":"cd961f24c473","desc":"Floating \"scroll back to top\" button — toggles a .show class once the page is scrolled past 400px (Lenis-aware) and smooth-scrolls to top on click.","when":"Any fixed/floating return-to-top affordance. Pair with src/scss/global/_component-back-to-top.scss for the fixed positioning + show/hide styles.","keywords":"back to top, scroll to top, return to top, scroll up button, floating button, page top, smooth scroll","note":"\u003cback-to-top>","usage":[],"copy":"\u003cback-to-top>\u003c/back-to-top>","protect":{"level":"core","group":"JS feature modules"}},{"kind":"js","name":"copy-to-clipboard-component","file":"src/js/modules/copy-to-clipboard.js","hash":"7d673e5bca08","desc":"Copies a preset string to the clipboard on click and shows a temporary \"copied\" success state (label swap + .is-copied class, auto-reset after 5s).","when":"Share-link buttons, coupon/discount code copy, \"copy URL/email\" affordances — anywhere a click should put text on the clipboard with visual feedback.","keywords":"copy to clipboard, copy link, share url, coupon code, discount code, copy button, copied feedback, clipboard writeText","note":"\u003ccopy-to-clipboard-component>","usage":[],"copy":"\u003ccopy-to-clipboard-component>\u003c/copy-to-clipboard-component>","protect":{"level":"core","group":"JS feature modules"}},{"kind":"js","name":"dialog-component","file":"src/js/modules/dialog.js","hash":"c583968bc8fe","desc":"Base infrastructure for ALL drawers, modals and popovers — wraps a native \u003cdialog> with showDialog/closeDialog/toggleDialog, ref-counted body scroll lock, focus trap + focus restore, click-outside and Escape close, closing animation hook (.dialog-closing) and theme-editor open-on-section-select.","when":"Any overlay UI: cart drawer, quick view, popups, menu drawers, confirmation modals — subclass DialogComponent or use \u003cdialog-component> directly; never hand-roll showModal/scroll-lock/focus handling. Main exports (@theme/dialog): DialogComponent, DialogOpenEvent (\"dialog:open\"), DialogCloseEvent (\"dialog:close\"), acquireThemeScrollLock, releaseThemeScrollLock. Pairs with src/scss/global/_component-dialog.scss.","keywords":"dialog, modal, drawer, popup, popover, overlay, lightbox shell, scroll lock, focus trap, escape close, click outside, showModal, cart drawer, quick view base","note":"\u003cdialog-component>","usage":[],"copy":"\u003cdialog-component>\u003c/dialog-component>","protect":{"level":"core","group":"JS feature modules"}},{"kind":"js","name":"popup","file":"src/js/modules/popup.js","hash":"137c651bdda7","desc":"Newsletter/promo popup dialog that auto-opens on page load, after a 5s delay, or after scrolling 700px, then suppresses itself via localStorage for a merchant-chosen repeat interval (30 mins up to never).","when":"Any marketing popup that must self-trigger and not nag returning visitors: newsletter signup, promo announcement, discount capture. Skips entirely in the theme editor. Pairs with src/scss/global/section-popup.scss.","keywords":"popup, newsletter popup, promo modal, auto open dialog, exit trigger, scroll trigger, delay open, show once, cookie suppression, subscribe modal","note":"\u003csubscribe-popup-component>","usage":[],"copy":"\u003csubscribe-popup-component>\u003c/subscribe-popup-component>","protect":{"level":"core","group":"JS feature modules"}},{"kind":"js","name":"qr-code-generator","file":"src/js/modules/qr-code-generator.js","hash":"61bec35d3c6e","desc":"Dependency-free QR code generation library (davidshimjs port) —
