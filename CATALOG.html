cd83a0bc"},{"file":".claude/skills/update-locales/SKILL.md","hash":"cc1dd29d48ba"}]}],"diff":null};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const state = { q: "", kinds: new Set(), changed: false, core: false };
const LEVEL = { locked: "🔒 Locked", core: "Sync từ core" };
const CORE_FILE_LIMIT = 40;
const CHANGE = {
  added: { label: "Mới", d: "var(--d-added)" },
  changed: { label: "Sửa", d: "var(--d-changed)" },
  renamed: { label: "Đổi tên", d: "var(--d-renamed)" },
  removed: { label: "Xoá", d: "var(--d-removed)" },
};
const TAG_LIMIT = 5;

// Theme toggle (remembered per browser; storage may be unavailable).
const root = document.documentElement;
try { const t = localStorage.getItem("catalog-theme"); if (t) root.dataset.theme = t; } catch {}
$("#theme").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("catalog-theme", root.dataset.theme); } catch {}
};

const total = DATA.cats.reduce((n, c) => n + c.items.length, 0);
$("#meta").textContent = total + " mục · cập nhật " + DATA.generated + (DATA.git && DATA.git.sha ? " · " + (DATA.git.branch || "detached") + "@" + DATA.git.sha : "");

// Kind filter chips
const kindCount = (id) => DATA.cats.reduce((n, c) => n + c.items.filter((i) => i.kind === id).length, 0);
$("#kinds").innerHTML = DATA.kinds.map((k) =>
  '<button class="chip" style="--c: var(--k-' + k.id + ')" data-kind="' + k.id + '" aria-pressed="false"><i class="dot"></i>' + k.label + ' <b>' + kindCount(k.id) + '</b></button>'
).join("");
const changedCount = DATA.cats.reduce((n, c) => n + c.items.filter((i) => i.change).length, 0);
if (changedCount) {
  $("#kinds").insertAdjacentHTML("beforeend",
    '<button class="chip chip--change" data-changed aria-pressed="false" title="Chỉ hiện mục mới / sửa / đổi tên so với lần chạy trước"><i class="dot"></i>Thay đổi <b>' + changedCount + "</b></button>");
}
const coreItemCount = DATA.cats.reduce((n, c) => n + c.items.filter((i) => i.protect).length, 0);
if (coreItemCount) {
  $("#kinds").insertAdjacentHTML("beforeend",
    '<button class="chip chip--core" data-core aria-pressed="false" title="Chỉ hiện module core — child không được sửa"><i class="dot"></i>🔒 Core <b>' + coreItemCount + "</b></button>");
}
$("#kinds").onclick = (e) => {
  const core = e.target.closest("[data-core]");
  if (core) {
    state.core = !state.core;
    core.setAttribute("aria-pressed", state.core);
    render();
    return;
  }
  const ch = e.target.closest("[data-changed]");
  if (ch) {
    state.changed = !state.changed;
    ch.setAttribute("aria-pressed", state.changed);
    render();
    return;
  }
  const btn = e.target.closest("[data-kind]");
  if (!btn) return;
  const k = btn.dataset.kind;
  state.kinds.has(k) ? state.kinds.delete(k) : state.kinds.add(k);
  btn.setAttribute("aria-pressed", state.kinds.has(k));
  render();
};

function matches(item, terms) {
  if (state.kinds.size && !state.kinds.has(item.kind)) return false;
  if (state.changed && !item.change) return false;
  if (state.core && !item.protect) return false;
  if (!terms.length) return true;
  const hay = (item.name + " " + item.desc + " " + (item.keywords || "") + " " + (item.note || "") + " " + item.file).toLowerCase();
  return terms.every((t) => hay.includes(t));
}

function hl(text, terms) {
  let out = esc(text);
  for (const t of terms) {
    if (t.length < 2) continue;
    out = out.replace(new RegExp("(" + t.replace(/[.*+?^$\{}()|[\]\\]/g, "\\$&") + ")(?![^<]*>)", "gi"), "<mark>$1</mark>");
  }
  return out;
}

function card(item, terms) {
  const kind = DATA.kinds.find((k) => k.id === item.kind);
  const tags = item.usage.slice(0, TAG_LIMIT).map((u) => '<span class="tag">' + esc(u) + "</span>").join("");
  const more = item.usage.length > TAG_LIMIT
    ? '<button class="tag tag--more" data-more>+' + (item.usage.length - TAG_LIMIT) + "</button>" : "";
  const href = "vscode://file/" + encodeURI(DATA.root + "/" + item.file);
  const ch = item.change && CHANGE[item.change.type];
  const chText = !item.change ? "" : item.change.type === "renamed" ? "Trước đây: " + item.change.from
    : item.change.type === "changed" ? "Đã đổi: " + item.change.reasons.join(", ") : "";
  return '<article class="card" style="--c: var(--k-' + item.kind + ')' + (ch ? "; --d: " + ch.d : "") + '"' + (ch ? ' data-change="' + item.change.type + '"' : "") + ' data-usage="' + esc(JSON.stringify(item.usage)) + '">' +
    '<div class="card__top"><span class="badge">' + kind.label + '</span><span class="card__name">' + hl(item.name, terms) + "</span>" +
    (ch ? '<span class="dbadge" title="So với lần chạy trước">' + ch.label + "</span>" : "") +
    (item.protect ? '<span class="pbadge" style="--p: var(--p-' + item.protect.level + ')" title="Core từ theme base: ' + esc(item.protect.group) + ' — child không được sửa">' + (item.protect.level === "locked" ? "🔒" : "Core") + "</span>" : "") +
    '<button class="copy" title="Copy: ' + esc(item.copy) + '" data-copy="' + esc(item.copy) + '" aria-label="Copy">' +
    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button></div>' +
    (item.desc ? '<p class="card__desc" title="Bấm để mở rộng">' + hl(item.desc, terms) + "</p>" : '<p class="card__desc is-empty">Chưa có mô tả</p>') +
    (item.when ? '<p class="card__when"><b>Khi nào dùng:</b> ' + esc(item.when) + "</p>" : "") +
    (chText ? '<div class="card__change">' + esc(chText) + "</div>" : "") +
    (item.note ? '<div class="card__note">' + hl(item.note, terms) + "</div>" : "") +
    (tags ? '<div class="tags" title="Dùng ở">' + tags + more + "</div>" : "") +
    '<a class="card__file" href="' + href + '" title="Mở trong VS Code"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3h7v7M10 14 21 3M21 14v7H3V3h7"/></svg><span>' + esc(item.file) + "</span></a>" +
    "</article>";
}

function render() {
  const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  let shown = 0;
  const nav = [];
  // While searching, categories with the most hits come first.
  const cats = DATA.cats.map((c) => ({ ...c, hits: c.items.filter((i) => matches(i, terms)) }));
  const ordered = terms.length ? [...cats].sort((a, b) => b.hits.length - a.hits.length) : cats;
  const html = ordered.map((c) => {
    const items = c.hits;
    shown += items.length;
    nav.push('<a href="#' + c.id + '" data-nav="' + c.id + '" class="' + (items.length ? "" : "is-empty") + '">' + esc(c.title) + "<span>" + items.length + "</span></a>");
    if (!items.length) return "";
    return '<section class="cat" id="' + c.id + '"><div class="cat__head"><h2>' + esc(c.title) + "</h2><span>" + items.length + " mục</span></div>" +
      '<p class="cat__need">Khi cần: ' + esc(c.need) + '</p><div class="grid">' + items.map((i) => card(i, terms)).join("") + "</div></section>";
  }).join("");

  // Protected core files: every file on disk (incl. scripts/, .claude/), not only catalog items.
  const coreChange = {};
  (DATA.diff?.protected || []).forEach((c) => (coreChange[c.file] = c.type));
  const coreGroups = (DATA.protected || []).map((g) => ({
    ...g,
    hits: g.files.filter((f) => (!state.changed || coreChange[f.file]) &&
      (!terms.length || terms.every((t) => (f.file + " " + g.title).toLowerCase().includes(t)))),
  })).filter((g) => g.hits.length);
  const coreTotal = coreGroups.reduce((n, g) => n + g.hits.length, 0);
  const showCore = !state.kinds.size && coreTotal > 0;
  const fileTag = (f) => {
    const c = coreChange[f.file];
    return '<a class="tag" href="vscode://file/' + encodeURI(DATA.root + "/" + f.file) + '" title="Mở trong VS Code"' +
      (c ? ' data-change style="--d: ' + CHANGE[c].d + '"' : "") + ">" + hl(f.file, terms) + (c ? " · " + CHANGE[c].label : "") + "</a>";
  };
  const coreHtml = showCore
    ? '<section class="cat" id="core"><div class="cat__head"><h2>Không được sửa · core từ theme base</h2><span>' + coreTotal + ' file</span></div>' +
      '<p class="cat__need">Các file này sync từ <code>foxtheme-base</code> xuống fork. Child sửa ở đây thì mỗi lần <code>yarn core:sync</code> sẽ conflict hoặc mất fix của core. Nguồn: FORK-WORKFLOW.md §5, §10.</p>' +
      '<div class="core-policy"><div><b>🔒 Locked</b>: tuyệt đối không sửa ở child. Bug nằm ở core thì dùng <code>/fix-core</code>.</div><div><b>Sync từ core</b>: không nên sửa. Muốn thay đổi thì extend ở <code>src/js/custom/</code>, sửa design layer SCSS, hoặc đề xuất lên core.</div></div>' +
      '<div class="core-groups">' + coreGroups.map((g) => {
        const files = g.hits.map(fileTag);
        const list = files.length > CORE_FILE_LIMIT && !terms.length
          ? "<details><summary>Hiện " + files.length + ' file</summary><div class="core-files">' + files.join("") + "</div></details>"
          : '<div class="core-files">' + files.join("") + "</div>";
        return '<article class="core-group" data-level="' + g.level + '"><div class="core-group__head"><span class="pbadge">' + LEVEL[g.level] + "</span><h3>" + esc(g.title) + "</h3><span>" + g.hits.length + " file</span></div>" +
          "<p>" + esc(g.why) + "</p><p><b>Thay vào đó:</b> " + esc(g.instead) + "</p>" + list + "</article>";
      }).join("") + "</div></section>"
    : "";
  nav.push('<a href="#core" data-nav="core" class="' + (showCore ? "" : "is-empty") + '">🔒 Không được sửa<span>' + (showCore ? coreTotal : 0) + "</span></a>");

  const settings = DATA.settings.filter((g) => !terms.length || terms.every((t) => (g.name + " " + g.ids.join(" ")).toLowerCase().includes(t)));
  const showSettings = !state.kinds.size && !state.changed && !state.core && settings.length;
  nav.push('<a href="#settings" data-nav="settings" class="' + (showSettings ? "" : "is-empty") + '">Global settings<span>' + (showSettings ? settings.length : 0) + "</span></a>");
  const settingsHtml = showSettings
    ? '<section class="cat" id="settings"><div class="cat__head"><h2>Global settings</h2><span>' + settings.length + ' nhóm</span></div><p class="cat__need">Khi cần: cấu hình toàn theme trong Theme settings (<code>settings.xxx</code>) · <code>config/settings_schema.json</code></p><div class="settings">' +
      settings.map((g) => '<article class="card" style="--c: var(--accent)"><div class="card__top"><span class="badge">' + g.ids.length + ' setting</span><span class="card__name">' + hl(g.name, terms) + '</span></div><div class="tags">' + g.ids.map((id) => '<span class="tag">' + hl(id, terms) + "</span>").join("") + "</div></article>").join("") +
      "</div></section>"
    : "";

  $("#content").innerHTML = html + coreHtml + settingsHtml || '<div class="empty"><b>Không tìm thấy</b>Thử từ khoá khác hoặc bỏ bớt bộ lọc.</div>';
  $("#nav").innerHTML = nav.join("");
  $(".steps").hidden = terms.length > 0 || state.kinds.size > 0 || state.changed || state.core;
  $("#count").textContent = (terms.length || state.kinds.size || state.changed || state.core) ? shown + " / " + total + " mục" : "";
  observe();
}

// "What changed since the last run" panel — built once, collapsible.
function renderChanges() {
  const d = DATA.diff;
  if (!d) return;
  const since = [d.prev.generated, d.prev.git && d.prev.git.sha ? (d.prev.git.branch || "detached") + "@" + d.prev.git.sha : ""].filter(Boolean).join(" · ");
  if (!d.total) {
    $("#changes").innerHTML = '<div class="changes changes--none">Không có thay đổi so với lần chạy trước (' + esc(since) + ")</div>";
    return;
  }
  const kindLabel = (k) => (DATA.kinds.find((x) => x.id === k) || { label: k }).label;
  const jump = (name) => '<button class="jump" data-jump="' + esc(name) + '" title="Lọc tới mục này"><code>' + esc(name) + "</code></button>";
  const row = (r, extra) => "<li>" + extra + " <small>" + esc(kindLabel(r.kind)) + "</small></li>";
  const col = (type, rows, fmt) => rows.length
    ? '<div class="changes__col" style="--d: ' + CHANGE[type].d + '"><h3>' + CHANGE[type].label + " · " + rows.length + "</h3><ul>" + rows.map(fmt).join("") + "</ul></div>" : "";
  const s = d.settings;
  const settingRows = [
    ...s.addedGroups.map((g) => "<li>+ nhóm <code>" + esc(g) + "</code></li>"),
    ...s.removedGroups.map((g) => "<li>− nhóm <code>" + esc(g) + "</code></li>"),
    ...s.ids.map((g) => "<li><code>" + esc(g.group) + "</code> <small>" + esc([...g.added.map((x) => "+" + x), ...g.removed.map((x) => "−" + x)].join(" ")) + "</small></li>"),
  ];
  const sum = [["added", d.added.length], ["changed", d.changed.length], ["renamed", d.renamed.length], ["removed", d.removed.length]]
    .filter(([, n]) => n).map(([t, n]) => '<span style="--d: ' + CHANGE[t].d + '">' + CHANGE[t].label + " " + n + "</span>").join("") +
    (settingRows.length ? '<span style="--d: var(--accent)">Settings ' + settingRows.length + "</span>" : "") +
    ((d.protected || []).length ? '<span style="--d: var(--p-locked)">Core ' + d.protected.length + "</span>" : "");
  $("#changes").innerHTML = '<details class="changes" open><summary><h2>Thay đổi so với lần chạy trước</h2><span class="changes__since">' + esc(since) + '</span><div class="changes__sum">' + sum + "</div></summary>" +
    '<div class="changes__body">' +
    col("added", d.added, (r) => row(r, jump(r.name))) +
    col("changed", d.changed, (r) => row(r, jump(r.name) + " <small>" + esc(r.reasons.join(", ")) + "</small>")) +
    col("renamed", d.renamed, (r) => row(r.to, "<code>" + esc(r.from.name) + "</code> → " + jump(r.to.name))) +
    col("removed", d.removed, (r) => row(r, "<code>" + esc(r.name) + "</code> <small>" + esc(r.file) + "</small>")) +
    (settingRows.length ? '<div class="changes__col" style="--d: var(--accent)"><h3>Global settings · ' + settingRows.length + "</h3><ul>" + settingRows.join("") + "</ul></div>" : "") +
    ((d.protected || []).length ? '<div class="changes__col" style="--d: var(--p-locked)"><h3>⚠ File core thay đổi · ' + d.protected.length + "</h3><ul>" +
      d.protected.map((c) => "<li>" + ({ added: "+", changed: "~", removed: "−" })[c.type] + " <code>" + esc(c.file) + "</code>" + (c.level === "locked" ? " <small>🔒 locked</small>" : "") + "</li>").join("") +
      "</ul><p class=\"changes__since\">Nếu không phải do <code>core:sync</code> thì child đang sửa core.</p></div>" : "") +
    "</div></details>";
}
$("#changes").onclick = (e) => {
  const j = e.target.closest("[data-jump]");
  if (!j) return;
  q.value = j.dataset.jump;
  state.q = q.value;
  render();
  $("#content").scrollIntoView({ behavior: "smooth" });
};

// Card interactions: copy, expand, show all usages
$("#content").onclick = async (e) => {
  const copy = e.target.closest("[data-copy]");
  if (copy) {
    try { await navigator.clipboard.writeText(copy.dataset.copy); toast("Đã copy: " + copy.dataset.copy); }
    catch { toast("Không copy được — trình duyệt chặn clipboard"); }
    return;
  }
  const more = e.target.closest("[data-more]");
  if (more) {
    const usage = JSON.parse(more.closest(".card").dataset.usage);
    more.parentElement.innerHTML = usage.map((u) => '<span class="tag">' + esc(u) + "</span>").join("");
    return;
  }
  if (e.target.closest(".card__desc:not(.is-empty)")) e.target.closest(".card").classList.toggle("is-open");
};

let toastTimer;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("is-on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("is-on"), 1600);
}

// Highlight the category currently in view
let io;
function observe() {
  io?.disconnect();
  io = new IntersectionObserver((entries) => {
    for (const en of entries) {
      if (!en.isIntersecting) continue;
      document.querySelectorAll("[data-nav]").forEach((a) => a.classList.toggle("is-active", a.dataset.nav === en.target.id));
    }
  }, { rootMargin: "-140px 0px -70% 0px" });
  document.querySelectorAll(".cat").forEach((s) => io.observe(s));
}

// Search: debounce + keyboard shortcuts ("/" focus, Esc clear)
const q = $("#q");
let timer;
q.oninput = () => { clearTimeout(timer); timer = setTimeout(() => { state.q = q.value.trim(); render(); }, 120); };
addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); q.select(); }
  if (e.key === "Escape" && document.activeElement === q) { q.value = ""; state.q = ""; render(); }
});

renderChanges();
render();
</script>
</body>
</html>
